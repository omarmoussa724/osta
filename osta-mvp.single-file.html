<title>OSTA Fabrication OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;450;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0B0D10; --ground-2:#0E1116; --ground-3:#101419;
  --panel:#14171C; --panel-2:#181C22; --panel-3:#1E232B;
  --line:#252A32; --line-2:#2F353F; --line-soft:#1B1F25;
  --ink:#E7EAEE; --ink-2:#A2ABB6; --ink-3:#6D7681; --ink-4:#525A64;
  --accent:#4C9AFF; --accent-ink:#A6CCFF; --accent-deep:#0A1D33;
  --ok:#35C88F; --info:#4C9AFF; --warn:#E0A63C; --crit:#E5484D; --violet:#9A7CF0; --idle:#6D7681;
  --radius:7px; --radius-sm:5px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Archivo','Inter',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:rgba(76,154,255,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232830;border-radius:6px;border:2px solid var(--ground)}
::-webkit-scrollbar-thumb:hover{background:#2f3742}

.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.h1{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.h2{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}

/* App shell */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ground-2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(150deg,#4C9AFF,#2A6BD4);display:grid;place-items:center;color:#06121F;font-family:var(--display);font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase;display:block;margin-top:1px}
.navgroup{margin-top:12px;padding:0 8px 4px}
.navgroup .eyebrow{font-size:9.5px}
.nav a{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:6px;color:var(--ink-2);font-size:12.5px;font-weight:450}
.nav a svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a.on{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav a.on svg{color:var(--accent)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.side-foot b{font-family:var(--display);font-size:12px;letter-spacing:.02em}
.side-foot span{font-size:10.5px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:52px;padding:0 22px;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-width:0;overflow:hidden}
.crumbs a{color:var(--ink-2);white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:13px;height:13px;color:var(--ink-4);flex:none}
.topbar .spacer{flex:1}
.tb-date{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-search{display:flex;align-items:center;gap:8px;padding:6px 10px;min-width:210px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink-3);font-size:12px;cursor:text}
.tb-search svg{width:14px;height:14px}
.tb-search kbd{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--line-2);border-radius:4px;color:var(--ink-3)}
.tb-ic{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2);cursor:pointer;position:relative}
.tb-ic:hover{background:var(--panel-2);color:var(--ink)}
.tb-ic svg{width:16px;height:16px}
.tb-ic .badge{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--ground)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(150deg,#2F3742,#1c2129);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink);border:1px solid var(--line-2)}

.page{padding:22px 26px 72px;max-width:1460px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.page-head .actions{display:flex;gap:8px;flex:none}

/* Panels / cards */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0}
.panel-b{padding:14px}
.panel-b.flush{padding:0}
.grid{display:grid;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.kpi .k-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpi .k-val{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .k-foot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.kpi .k-foot .up{color:var(--ok)}
.kpi .k-foot .down{color:var(--crit)}
.kpi .k-foot svg{width:12px;height:12px}
.kpi .k-spark{position:absolute;right:10px;bottom:10px;opacity:.6}

/* pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 7px;border-radius:999px;font-size:10.5px;font-weight:500;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap;line-height:1.4}
.pill .dot{width:6px;height:6px;border-radius:50%;flex:none}
.pill.sq{border-radius:5px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-size:12px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:#3a414c}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121F;font-weight:600}
.btn.primary:hover{background:#3f8ef5;border-color:#3f8ef5}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{padding:5px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--ground-2);position:sticky;top:0;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tr.norow{cursor:default}
.tbl tr.norow:hover{background:transparent}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.tbl a.lnk{color:var(--accent-ink)}
.tbl a.lnk:hover{text-decoration:underline}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.code.dimc{color:var(--ink-2)}

/* progress bar */
.bar{height:6px;border-radius:999px;background:var(--panel-3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .3s}
.bar.tall{height:8px}

/* misc */
.divider{height:1px;background:var(--line);margin:2px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 12px;font-size:12.5px;color:var(--ink-3);border-bottom:2px solid transparent;font-weight:450}
.tabs a:hover{color:var(--ink-2)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:46px 20px;color:var(--ink-3);gap:10px}
.empty svg{width:26px;height:26px;color:var(--ink-4)}
.empty b{color:var(--ink-2);font-weight:600;font-size:13px}
.empty p{margin:0;font-size:12px;max-width:320px}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:6px 10px;font-size:11.5px;color:var(--ink-3);background:transparent;border:0;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--panel-3);color:var(--ink)}
.inp{padding:7px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:12px;min-width:200px}
.inp::placeholder{color:var(--ink-4)}
.inp:focus{outline:none;border-color:var(--accent)}

/* flow stages */
.flow{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.stage{flex:1;min-width:132px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
.stage+.stage{margin-left:26px}
.stage .arrow{position:absolute;left:-24px;top:50%;transform:translateY(-50%);color:var(--ink-4)}
.stage .arrow svg{width:16px;height:16px}
.stage .s-name{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stage .s-count{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stage .s-delay{font-size:10.5px;font-variant-numeric:tabular-nums}
.stage.bottleneck{box-shadow:inset 0 0 0 1px var(--crit),0 0 0 1px var(--crit)}
.stage .s-top{position:absolute;top:0;left:12px;right:12px;height:2px;border-radius:2px}

/* risks */
.risk{display:flex;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);align-items:flex-start}
.risk .rdot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:none}
.risk .rmain{flex:1;min-width:0}
.risk .rtitle{font-size:12.5px;font-weight:500}
.risk .rmeta{font-size:11px;color:var(--ink-3);margin-top:2px}
.risk .rtag{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-step{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:4px}
.tl-rail{display:flex;flex-direction:column;align-items:center}
.tl-node{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink-4);background:var(--ground);flex:none;margin-top:2px}
.tl-node.done{background:var(--ok);border-color:var(--ok)}
.tl-node.cur{border-color:var(--accent);background:var(--accent-deep);box-shadow:0 0 0 4px rgba(76,154,255,.16)}
.tl-node.fail{background:var(--crit);border-color:var(--crit)}
.tl-line{flex:1;width:2px;background:var(--line-2);margin:3px 0}
.tl-line.done{background:var(--ok)}
.tl-step .tl-body{padding-bottom:16px}
.tl-step:last-child .tl-body{padding-bottom:0}
.tl-name{font-size:12.5px;font-weight:500}
.tl-name.muted2{color:var(--ink-3);font-weight:450}
.tl-when{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:2px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;align-items:start}
.klane{background:var(--ground-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:120px}
.klane.drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--ground-2))}
.klane-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.klane-h .kt{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.klane-h .kn{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.klane-b{padding:10px;display:flex;flex-direction:column;gap:9px}
.jcard{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab}
.jcard:active{cursor:grabbing}
.jcard.drag{opacity:.4}
.jcard .jc-code{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);font-weight:500}
.jcard .jc-desc{font-size:12px}
.jcard .jc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--ink-3)}
.jcard .jc-meta b{color:var(--ink-2);font-weight:500}

/* nesting sheet */
.sheet-box{background:var(--ground-2);border:1px solid var(--line);border-radius:8px;padding:16px}

/* command palette */
.cmdk-ov{position:fixed;inset:0;z-index:80;background:rgba(4,6,9,.62);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.cmdk{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 24px 60px -12px rgba(0,0,0,.7);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in svg{width:16px;height:16px;color:var(--ink-3)}
.cmdk-in input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-size:14px;font-family:var(--sans)}
.cmdk-res{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-grp{font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);padding:10px 10px 5px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;cursor:pointer}
.cmdk-item:hover,.cmdk-item.sel{background:var(--panel-3)}
.cmdk-item svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.cmdk-item .ci-main{flex:1;min-width:0}
.cmdk-item .ci-label{font-size:12.5px}
.cmdk-item .ci-sub{font-size:10.5px;color:var(--ink-3)}
.cmdk-item .ci-code{font-family:var(--mono);font-size:10px;color:var(--ink-4);padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.cmdk-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-4)}
.cmdk-hint{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:12px}
.cmdk-hint code{font-family:var(--mono);color:var(--accent-ink);background:var(--panel-2);padding:1px 5px;border-radius:4px}

/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;background:var(--panel-3);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);animation:tin .18s ease-out}
.toast svg{width:15px;height:15px;flex:none;margin-top:1px}
.toast .tt{font-size:12.5px}
.toast .td{font-size:11px;color:var(--ink-3);margin-top:1px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

.skeleton{padding:60px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-3);font-family:var(--display)}
.skeleton .sp{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.c8-4{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.c7-5{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}

@media (max-width:1180px){
  .app{grid-template-columns:0 1fr}
  .side{position:fixed;left:0;top:0;z-index:60;width:238px;transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .c8-4,.c7-5{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(5,minmax(180px,1fr));overflow-x:auto}
}
@media (max-width:720px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .two,.three{grid-template-columns:1fr}
  .page{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<div id="root"><div class="skeleton"><div class="sp"></div><div>Loading OSTA workspace…</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext } = React;

/* ============================== utils ============================== */
function cx(){ return Array.prototype.filter.call(arguments, Boolean).join(' '); }
function hexA(hex, a){
  const h = hex.replace('#',''); const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const TONE = { ok:'#35C88F', info:'#4C9AFF', warn:'#E0A63C', crit:'#E5484D', violet:'#9A7CF0', idle:'#6D7681', accent:'#4C9AFF' };
function toneColor(t){ return TONE[t] || TONE.idle; }
function fmtInt(n){ return (n==null||isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US'); }
function fmtEGP(n){
  if(n==null) return '—';
  if(n>=1e6) return 'EGP ' + (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if(n>=1e3) return 'EGP ' + Math.round(n).toLocaleString('en-US');
  return 'EGP ' + fmtInt(n);
}

/* ============================== router ============================== */
function useRoute(){
  const read = () => (window.location.hash.replace(/^#/, '') || '/');
  const [path, setPath] = useState(read());
  useEffect(() => {
    const on = () => { setPath(read()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const segs = path.split('?')[0].split('/').filter(Boolean);
  return { path, segs };
}
function go(href){ window.location.hash = href; }
function A(props){
  const { href, children, className, onClick, title, style } = props;
  return <a href={'#' + href} className={className} title={title} style={style}
    onClick={(e)=>{ if(onClick) onClick(e); }}>{children}</a>;
}

  OUTSOURCE.forEach(o => idx.push({ type:'Outsourcing', label:o.id, sub:findSupplier(o.supplier).name + ' · ' + o.process, code:o.rfq, href:'/outsourcing/' + o.id, icon:'outsourcing' }));
  NESTS.forEach(n => idx.push({ type:'Nesting', label:n.id, sub:n.grade + ' ' + n.thk + ' mm · ' + n.machine, code:n.id, href:'/nesting/' + n.id, icon:'nesting' }));
  MATERIALS.forEach(m => idx.push({ type:'Material', label:m.grade + ' · ' + m.thk + ' mm', sub:m.family + (m.shortage>0 ? ' · shortage ' + m.shortage + ' t' : ' · in stock'), code:m.key, href:'/materials', icon:'materials' }));
  SUPPLIERS.forEach(s => idx.push({ type:'Supplier', label:s.name, sub:s.city + ' · ' + s.processes.join(', '), code:s.id, href:'/suppliers', icon:'suppliers' }));
  ISSUES.forEach(i => idx.push({ type:'Issue', label:i.id, sub:i.title, code:i.id, href:'/issues', icon:'issues' }));
  return idx;
}

/* parts that reference a given part number across every module — the OSTA connective tissue */
function connectionsFor(pid){
  const part = findPart(pid); if(!part) return [];
  const out = [];
  const proj = findProject(part.project); const asm = findAssembly(part.assembly);
  if(proj) out.push({ type:'Project', label:proj.code, sub:proj.name, href:'/projects/' + proj.code, icon:'projects' });
  if(asm) out.push({ type:'Assembly', label:asm.code, sub:asm.name, href:'/projects/' + part.project + '/asm/' + asm.code, icon:'bom' });
  out.push({ type:'BOM', label:'BOM line', sub:part.qty + '× · ' + part.grade + ' ' + part.thk + ' mm · Rev ' + part.rev, href:'/bom', icon:'bom' });
  const mat = findMat(part.grade, part.thk);
  if(mat) out.push({ type:'Material', label:mat.grade + ' ' + mat.thk + ' mm', sub: mat.shortage>0 ? 'Shortage ' + mat.shortage + ' t' : 'Available ' + (mat.avail-mat.reserved).toFixed(1) + ' t', href:'/materials', icon:'materials' });
  const nest = NESTS.find(n => n.grade===part.grade && n.thk===part.thk && n.project===part.project);
  if(nest) out.push({ type:'Nesting', label:nest.id, sub:nest.util + '% utilisation · ' + nest.machine, href:'/nesting/' + nest.id, icon:'nesting' });
  const job = JOBS.find(j => j.part===pid);
  if(job) out.push({ type:'Production', label:job.id, sub:job.op + ' · ' + job.machine + ' · ' + job.progress + '%', href:'/production', icon:'production' });
  if(part.outsource){ const o = findOut(part.outsource); if(o) out.push({ type:'Outsourcing', label:o.id, sub:findSupplier(o.supplier).name + ' · ' + o.process, href:'/outsourcing/' + o.id, icon:'outsourcing' }); }
  const qc = QC.filter(q => q.part===pid);
  qc.forEach(q => out.push({ type:'QC', label:q.id, sub:q.type + ' · ' + q.result, href:'/qc', icon:'qc' }));
  const iss = ISSUES.filter(i => i.ref===pid);
  iss.forEach(i => out.push({ type:'Issue', label:i.id, sub:i.title, href:'/issues', icon:'issues' }));
  return out;
}

/* tiny SVG charts */
function Spark({ data, w, h, color }){
  w = w || 72; h = h || 22; color = color || 'var(--accent)';
  const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
  const pts = data.map((v, i) => [i/(data.length-1)*w, h - ((v-mn)/rng)*(h-3) - 1.5]);
  const d = pts.map((p,i) => (i? 'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} fill="none" aria-hidden="true">
      <path d={d} stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color}/>
    </svg>
  );
}
function BarsH({ rows, unit, fmt }){
  const mx = Math.max(...rows.map(r => r.v)) || 1;
  return (
    <div className="stack" style={{ gap:10 }}>
      {rows.map((r, i) => (
        <div key={i} style={{ display:'grid', gridTemplateColumns:'130px 1fr 78px', alignItems:'center', gap:12 }}>

        </div>
      ))}
    </div>

function AreaTrend({ data, target, height }){
  const w = 520, h = height || 150, pl = 6, pr = 6, pt = 10, pb = 18;
  const mn = Math.min(...data, target || Infinity) - 4;
  const mx = Math.max(...data, target || 0) + 4;
  const rng = mx - mn || 1;
  const X = i => pl + i/(data.length-1)*(w-pl-pr);
  const Y = v => pt + (1 - (v-mn)/rng)*(h-pt-pb);
  const line = data.map((v,i) => (i? 'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = line + ' L ' + X(data.length-1).toFixed(1) + ' ' + (h-pb) + ' L ' + X(0).toFixed(1) + ' ' + (h-pb) + ' Z';
  return (
    <svg viewBox={'0 0 ' + w + ' ' + h} width="100%" preserveAspectRatio="none" style={{ display:'block' }}>
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stopColor="#4C9AFF" stopOpacity="0.28"/><stop offset="1" stopColor="#4C9AFF" stopOpacity="0"/>
      </linearGradient></defs>
      {[0,0.5,1].map((f,i) => <line key={i} x1={pl} x2={w-pr} y1={pt + f*(h-pt-pb)} y2={pt + f*(h-pt-pb)} stroke="#252A32" strokeWidth="1"/>)}
      {target ? <line x1={pl} x2={w-pr} y1={Y(target)} y2={Y(target)} stroke="#35C88F" strokeWidth="1" strokeDasharray="4 4"/> : null}
      {target ? <text x={w-pr} y={Y(target)-4} textAnchor="end" fontSize="9" fill="#35C88F">target {target}%</text> : null}
      <path d={area} fill="url(#ag)"/>
      <path d={line} fill="none" stroke="#4C9AFF" strokeWidth="1.75" strokeLinejoin="round" strokeLinecap="round"/>
      <circle cx={X(data.length-1)} cy={Y(data[data.length-1])} r="3" fill="#4C9AFF"/>
      <text x={pl} y={h-5} fontSize="9" fill="#6D7681">12 weeks ago</text>
      <text x={w-pr} y={h-5} textAnchor="end" fontSize="9" fill="#6D7681">now</text>
    </svg>
  );
}

/* nesting sheet visual — illustrative shelf pack, not a real nest */
function SheetView({ nest, big }){
  const seed = parseInt(nest.id.replace(/\D/g,''), 10) || 1;
  const rng = mulberry32(seed);
  const W = big ? 640 : 380;
  const scale = W / nest.sheetL;
  const H = nest.sheetW * scale;
  const pad = 6, gap = 5;
  const rects = [];
  let x = pad, y = pad, rowH = 0;
  for (let i = 0; i < nest.parts; i++){
    const pw = (28 + rng()*70) * (big ? 1.5 : 1);
    const ph = (22 + rng()*54) * (big ? 1.5 : 1);
    if (x + pw > W - pad){ x = pad; y += rowH + gap; rowH = 0; }
    if (y + ph > H - pad) break;
    rects.push({ x, y, pw, ph });
    x += pw + gap; rowH = Math.max(rowH, ph);
  }
  return (
    <svg viewBox={'0 0 ' + W + ' ' + H} width="100%" style={{ display:'block', maxHeight: big ? 320 : 200 }}>
      <rect x="0.5" y="0.5" width={W-1} height={H-1} fill="#0E1116" stroke="#2F353F"/>
      {rects.map((r, i) => (
        <rect key={i} x={r.x} y={r.y} width={r.pw} height={r.ph} rx="1.5"
          fill={hexA('#4C9AFF', 0.16)} stroke="#4C9AFF" strokeWidth="1" strokeOpacity="0.55"/>
      ))}
      <text x={W-6} y={H-6} textAnchor="end" fontSize="9" fill="#6D7681" fontFamily="var(--mono)">
        {nest.sheetW} × {nest.sheetL} mm · {nest.grade} {nest.thk} mm
      </text>
    </svg>
  );
}

function CommandPalette({ open, onClose }){
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (open){ setQ(''); setSel(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 20); } }, [open]);
  const results = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    return SEARCH_INDEX
      .map(it => {
        const hay = (it.label + ' ' + it.sub + ' ' + it.type + ' ' + (it.code||'')).toLowerCase();
        let score = -1;
        if (hay.includes(s)) score = it.label.toLowerCase().includes(s) ? 3 : 1;
        return { it, score };
      })
      .filter(r => r.score >= 0)
      .sort((a,b) => b.score - a.score)
      .slice(0, 24)
      .map(r => r.it);
  }, [q]);
  const groups = useMemo(() => {
    const g = {};
    results.forEach(r => { (g[r.type] = g[r.type] || []).push(r); });
    return g;
  }, [results]);
  const flat = results;
  useEffect(() => {
    if (!open) return;
    const on = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowDown'){ e.preventDefault(); setSel(s => Math.min(s + 1, flat.length - 1)); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
      else if (e.key === 'Enter' && flat[sel]){ go(flat[sel].href); onClose(); }
    };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, [open, flat, sel, onClose]);
  if (!open) return null;
  let running = -1;
  return (
    <div className="cmdk-ov" onMouseDown={onClose}>
      <div className="cmdk" onMouseDown={e => e.stopPropagation()}>
        <div className="cmdk-in">
          <Icon n="search"/>
          <input ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setSel(0); }}
            placeholder="Search parts, projects, RFQs, materials…  e.g. P-001245"/>
          <span className="cmdk-item ci-code" style={{ padding:'2px 6px' }}>ESC</span>
        </div>
        <div className="cmdk-res">
          {!q.trim() ? (
            <div className="cmdk-hint">
              One part number connects the whole workflow.<br/>Try <code>P-001245</code>, <code>PRJ-26001</code>, <code>OUT-0261</code> or <code>S235JR</code>.
            </div>
          ) : flat.length === 0 ? (
            <div className="cmdk-hint">No matches for “{q}”.</div>
          ) : (
            Object.keys(groups).map(gk => (
              <div key={gk}>
                <div className="cmdk-grp">{gk}</div>
                {groups[gk].map(it => {
                  running += 1; const idx = running;
                  return (
                    <div key={it.label + it.href} className={cx('cmdk-item', idx === sel && 'sel')}
                      onMouseEnter={() => setSel(idx)}
                      onClick={() => { go(it.href); onClose(); }}>
                      <Icon n={it.icon}/>
                      <div className="ci-main">
                        <div className="ci-label mono">{it.label}</div>
                        <div className="ci-sub">{it.sub}</div>
                      </div>
                      <Icon n="cornerR" size={13}/>
                    </div>
                  );
                })}
              </div>
            ))
          )}
        </div>
        <div className="cmdk-foot">
          <span>↑ ↓ navigate</span><span>↵ open</span><span>esc close</span>
        </div>
      </div>
    </div>
  );
}

/* breadcrumb resolver */
function resolveCrumbs(segs){
  const base = [{ label:'OSTA', href:'/' }];
  if (segs.length === 0) return [{ label:'Command Center' }];
  const [a, b, c, d] = segs;
  const map = {
    projects:'Projects', production:'Production', outsourcing:'Outsourcing', bom:'BOM',
    parts:'Parts', cadcam:'CAD / CAM', nesting:'Nesting', materials:'Materials',
    inventory:'Inventory', suppliers:'Suppliers', qc:'QC', issues:'NCR / Issues',
    analytics:'Analytics', settings:'Settings',
  };
  if (a === 'projects'){
    const out = [...base, { label:'Projects', href:'/projects' }];
    if (b){
      const p = findProject(b);
      out.push({ label: p ? p.code : b, href:'/projects/' + b });
      if (c === 'asm' && d){
        const asm = findAssembly(d);
        out.push({ label: asm ? asm.code : d });
      } else if (c && c !== 'overview'){
        out.push({ label: c.charAt(0).toUpperCase() + c.slice(1) });
      }
    }
    return out;
  }
  if (a === 'parts' && b){
    const p = findPart(b);
    const out = [...base, { label:'Parts', href:'/parts' }];
    if (p){
      out.push({ label:p.project, href:'/projects/' + p.project });
      out.push({ label:p.assembly, href:'/projects/' + p.project + '/asm/' + p.assembly });
    }
    out.push({ label: b });
    return out;
  }
  if (a === 'outsourcing'){
    const out = [...base, { label:'Outsourcing', href:'/outsourcing' }];
    if (b) out.push({ label:b });
    return out;
  }
  if (a === 'nesting'){
    const out = [...base, { label:'Nesting', href:'/nesting' }];
    if (b) out.push({ label:b });
    return out;
  }
  return [...base, { label: map[a] || a }];
}

  const toast = useToast();
  const p = findPart(id);
  if (!p) return <div className="page"><Empty icon="parts" title="Part not found" hint={'No part matches ' + id} action={<A href="/parts" className="btn">All parts</A>}/></div>;
  const mat = findMat(p.grade, p.thk);
  const conns = connectionsFor(id);
  const finalIdx = p.ops.indexOf('FINAL_DIM_QC');
  const qcPassed = p.qcState === 'PASSED';
  const blocked = p.status === 'BLOCKED' || p.status === 'FAILED';
  return (
    <div className="page">
      <PageHead title={<span>{p.id} <span className="muted" style={{ fontWeight:400 }}>· {p.desc}</span></span>}
        sub={<span><A href={'/projects/' + p.project} className="lnk">{p.project}</A> / <A href={'/projects/' + p.project + '/asm/' + p.assembly} className="lnk">{p.assembly}</A> · Rev {p.rev}</span>}>
        <button className="btn ghost" onClick={() => toast('Drawing ' + p.drawing + ' opened')}><Icon n="file"/>{p.drawing}</button>
        <MfgStatus s={p.status}/>
      </PageHead>

      {blocked ? (
        <div className="risk" style={{ marginBottom:16, borderColor: hexA(toneColor('crit'), 0.4), background: hexA(toneColor('crit'), 0.06) }}>
          <span className="rdot" style={{ background:'var(--crit)' }}/>
          <span className="rmain">
            <span className="rtitle">{p.status === 'FAILED' ? 'Failed final dimensional QC' : 'Part is blocked'}</span>
            <span className="rmeta" style={{ display:'block' }}>{p.note}</span>
          </span>
        </div>
      ) : null}

      <div className="c8-4">
        <div className="stack">
          <Panel title="Manufacturing Timeline">
            <div className="tl">
              {p.ops.map((op, i) => {
                const done = i < p.opIndex || (p.status === 'READY' && i <= p.opIndex) || (p.status === 'COMPLETE');
                const cur = i === p.opIndex && !['READY','COMPLETE'].includes(p.status);
                const fail = op === 'FINAL_DIM_QC' && p.qcState === 'FAILED';
                const last = i === p.ops.length - 1;
                return (
                  <div className="tl-step" key={op}>
                    <div className="tl-rail">
                      <span className={cx('tl-node', fail ? 'fail' : done ? 'done' : cur ? 'cur' : '')}/>
                      {!last ? <span className={cx('tl-line', done && 'done')}/> : null}
                    </div>
                    <div className="tl-body">
                      <div className={cx('tl-name', !done && !cur && 'muted2')}>
                        {op}
                        {op === 'FINAL_DIM_QC' ? <span className="muted" style={{ fontSize:10.5 }}>  · mandatory gate</span> : null}
                        {cur ? <span style={{ marginLeft:8 }}><Pill tone="info">Current operation</Pill></span> : null}
                        {fail ? <span style={{ marginLeft:8 }}><Pill tone="crit">Failed</Pill></span> : null}
                      </div>
                      {cur && p.machine ? <div className="tl-when">on {p.machine}</div> : null}
                      {op === 'Ready for Assembly' && !qcPassed ? <div className="tl-when" style={{ color:'var(--warn)' }}>gated — FINAL_DIM_QC must pass first</div> : null}
                    </div>
                  </div>
                );
              })}
            </div>
          </Panel>

          <Panel title="Workflow Connections" actions={<span className="chip">{p.id} across {conns.length} modules</span>}>
            <div className="two" style={{ gap:8 }}>
              {conns.map((c, i) => (
                <A key={i} href={c.href} className="risk" style={{ padding:'9px 11px' }}>
                  <Icon n={c.icon} size={14} style={{ color:'var(--ink-3)', marginTop:2 }}/>
                  <span className="rmain">
                    <span style={{ fontSize:11.5, fontWeight:500 }}>{c.type}</span>
                    <span className="rmeta" style={{ display:'block' }}><span className="mono">{c.label}</span> · {c.sub}</span>
                  </span>
                  <Icon n="chevR" size={13} cls="muted"/>
                </A>
              ))}
            </div>
          </Panel>
        </div>

        <div className="stack">
          <Panel title="Specification">
            <dl className="kv">
              <dt>Project</dt><dd><A href={'/projects/' + p.project} className="lnk mono">{p.project}</A></dd>
              <dt>Assembly</dt><dd><A href={'/projects/' + p.project + '/asm/' + p.assembly} className="lnk mono">{p.assembly}</A></dd>
              <dt>Material</dt><dd><A href="/materials" className="lnk">{p.grade}</A></dd>
              <dt>Thickness</dt><dd className="mono">{p.thk} mm</dd>
              <dt>Quantity</dt><dd className="mono">{p.qty}</dd>
              <dt>Unit weight</dt><dd className="mono">{p.unitKg} kg</dd>
              <dt>Total weight</dt><dd className="mono">{p.weightKg} kg</dd>
              <dt>Revision</dt><dd className="mono">{p.rev}</dd>
              <dt>Drawing</dt><dd className="mono">{p.drawing}</dd>
              <dt>CAD file</dt><dd className="mono">{p.cad}</dd>
              <dt>Current status</dt><dd><MfgStatus s={p.status}/></dd>
            </dl>
          </Panel>

          <Panel title="Final Gate">
            <div className="stack" style={{ gap:10 }}>
              <div className="between">
                <span style={{ fontSize:12.5 }}>FINAL_DIM_QC</span>
                <Pill tone={p.qcState === 'PASSED' ? 'ok' : p.qcState === 'FAILED' ? 'crit' : p.qcState === 'PENDING' ? 'warn' : 'idle'}>
                  {p.qcState === 'NONE' ? 'Not reached' : p.qcState}
                </Pill>
              </div>
              <div className="muted" style={{ fontSize:11.5, lineHeight:1.5 }}>
                OSTA business rule — a part cannot become <b className="dim">Ready for Assembly</b> until final dimensional QC passes. {finalIdx >= 0 ? p.ops.length - 1 - finalIdx : 1} step(s) remain after the gate.
              </div>
              <div className="between" style={{ paddingTop:4, borderTop:'1px solid var(--line)' }}>
                <span style={{ fontSize:12.5 }}>Ready for Assembly</span>
                {qcPassed ? <Pill tone="ok">Released</Pill> : <span className="chip"><Icon n="lock" size={11}/> Locked</span>}
              </div>
            </div>
          </Panel>

          {mat ? (
            <Panel title="Material Position">
              <dl className="kv">
                <dt>Grade</dt><dd className="mono">{mat.grade} · {mat.thk} mm</dd>
                <dt>Available</dt><dd className="mono">{(mat.avail - mat.reserved).toFixed(1)} t</dd>
                <dt>Required</dt><dd className="mono">{mat.required} t</dd>
                <dt>Shortage</dt><dd className="mono" style={{ color: mat.shortage > 0 ? 'var(--crit)' : 'var(--ok)' }}>{mat.shortage > 0 ? mat.shortage + ' t' : 'none'}</dd>
              </dl>
            </Panel>
          ) : null}
        </div>
      </div>
    </div>
  );
}

/* ============================== page · production board ============================== */
const COLS = [
  { key:'READY', label:'Ready', tone:'ok' },
  { key:'IN_PRODUCTION', label:'In Production', tone:'info' },
  { key:'QC', label:'QC', tone:'warn' },
  { key:'COMPLETE', label:'Complete', tone:'ok' },
  { key:'BLOCKED', label:'Blocked', tone:'crit' },
];
function Production(){
  const toast = useToast();
  const [jobs, setJobs] = useState(JOBS);
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const move = (jid, col) => {
    setJobs(js => js.map(j => {
      if (j.id !== jid) return j;
      if (col === 'COMPLETE'){
        const pt = findPart(j.part);
        if (pt && pt.qcState !== 'PASSED' && j.op !== 'FINAL_DIM_QC' ? false : (pt && pt.qcState === 'FAILED')){
          toast({ tone:'crit', title:'Blocked by QC rule', desc:'FINAL_DIM_QC must pass before ' + j.part + ' can complete' });
          return j;
        }
        if (pt && pt.qcState === 'FAILED'){
          toast({ tone:'crit', title:'Blocked by QC rule', desc:'FINAL_DIM_QC failed for ' + j.part });
          return j;
        }
      }
      toast({ title:'Job moved', desc:j.part + ' → ' + (COLS.find(c => c.key === col) || {}).label });
      return { ...j, col };
    }));
  };
  return (
    <div className="page">
      <PageHead title="Production Board" sub="Live shop-floor jobs · drag a card to move it between states">
        <A href="/nesting" className="btn ghost"><Icon n="nesting"/>Nesting queue</A>
        <button className="btn ghost"><Icon n="refresh"/>Sync MES</button>
      </PageHead>
      <div className="board">
        {COLS.map(c => {
          const list = jobs.filter(j => j.col === c.key);
          return (
            <div key={c.key} className={cx('klane', over === c.key && 'drop')}
              onDragOver={e => { e.preventDefault(); setOver(c.key); }}
              onDragLeave={() => setOver(o => o === c.key ? null : o)}
              onDrop={e => { e.preventDefault(); setOver(null); if (drag) move(drag, c.key); setDrag(null); }}>
              <div className="klane-h">
                <span className="kt"><span className="dot" style={{ display:'inline-block', width:6, height:6, borderRadius:9, background: toneColor(c.tone), marginRight:6 }}/>{c.label}</span>
                <span className="kn">{list.length}</span>
              </div>
              <div className="klane-b">
                {list.length === 0 ? <div className="muted" style={{ fontSize:11, padding:'8px 2px' }}>{c.key === 'BLOCKED' ? 'Nothing blocked' : 'Empty'}</div> : null}
                {list.map(j => {
                  const pt = findPart(j.part);
                  return (
                    <div key={j.id} className={cx('jcard', drag === j.id && 'drag')} draggable
                      onDragStart={() => setDrag(j.id)} onDragEnd={() => setDrag(null)}
                      onClick={() => go('/parts/' + j.part)}>
                      <div className="between">
                        <span className="jc-code">{j.part}</span>
                        <span className="mono muted" style={{ fontSize:10 }}>{j.id}</span>
                      </div>
                      <div className="jc-desc">{pt ? pt.desc : '—'}</div>
                      <div className="jc-meta">
                        <span><b>{j.op}</b></span>
                        <span>{j.machine}</span>
                        <span>Op: {j.operator}</span>
                        <span>Qty {j.qty}</span>
                        <span>Due {fmtDateShort(j.due)}</span>
                      </div>
                      {j.block ? <div style={{ fontSize:10.5, color:'var(--crit)' }}><Icon n="lock" size={10}/> {j.block}</div>
                        : <Bar value={j.progress} tone={j.progress === 100 ? 'ok' : c.tone}/>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      <div className="muted" style={{ fontSize:11, marginTop:12 }}>
        Rule enforced — a job cannot move to <b className="dim">Complete</b> while its part's FINAL_DIM_QC has failed.
      </div>
    </div>
  );
}

/* ============================== page · BOM ============================== */
function BomTree({ only }){
  const toast = useToast();
  const projects = only ? [findProject(only)].filter(Boolean) : PROJECTS.filter(p => projectAssemblies(p.code).length);
  const [open, setOpen] = useState(() => {
    const o = {}; projects.forEach(p => { o[p.code] = true; });
    ASSEMBLIES.forEach(a => { if (!a.parent) o[a.code] = only ? true : false; });
    return o;
  });
  const tog = k => setOpen(o => ({ ...o, [k]: !o[k] }));
  const Row = ({ depth, children, k, hasKids, meta }) => (
    <div className="between" style={{ padding:'7px 12px', borderBottom:'1px solid var(--line-soft)', cursor: hasKids ? 'pointer' : 'default' }}
      onClick={hasKids ? () => tog(k) : undefined}>
      <span className="row" style={{ gap:7, alignItems:'center', paddingLeft: depth * 20, minWidth:0 }}>
        {hasKids ? <Icon n={open[k] ? 'chevD' : 'chevR'} size={13} cls="muted"/> : <span style={{ width:13, display:'inline-block' }}/>}
        {children}
      </span>
      {meta}
    </div>
  );
  return (
    <Panel title={only ? 'Bill of Materials' : 'Bill of Materials · all projects'} pad={false}
      actions={<button className="btn ghost sm" onClick={() => toast('BOM import is a stub in the MVP')}><Icon n="upload"/>Import BOM</button>}>
      <div style={{ display:'grid', gridTemplateColumns:'1fr', fontSize:12.5 }}>
        <div className="between" style={{ padding:'9px 12px', borderBottom:'1px solid var(--line)', color:'var(--ink-3)', fontSize:10, letterSpacing:'.09em', textTransform:'uppercase' }}>
          <span>Item · Description</span><span>Qty · Material · Thk · Rev · Status</span>
        </div>
        {projects.map(p => (
          <React.Fragment key={p.code}>
            <Row depth={0} k={p.code} hasKids meta={<span className="muted mono" style={{ fontSize:10.5 }}>{projectParts(p.code).length} parts</span>}>
              <span className="code" style={{ fontWeight:500 }}>{p.code}</span>
              <span className="muted">{p.name}</span>
            </Row>
            {open[p.code] && projectAssemblies(p.code).filter(a => !a.parent).map(a => {
              const subs = projectAssemblies(p.code).filter(x => x.parent === a.code);
              return (
                <React.Fragment key={a.code}>
                  <Row depth={1} k={a.code} hasKids meta={<span className="muted mono" style={{ fontSize:10.5 }}>{a.completion}%</span>}>
                    <Icon n="bom" size={13} cls="muted"/>
                    <A href={'/projects/' + p.code + '/asm/' + a.code} className="code lnk" onClick={e => e.stopPropagation()}>{a.code}</A>
                    <span className="muted">{a.name}</span>
                  </Row>
                  {open[a.code] && subs.map(su => (
                    <React.Fragment key={su.code}>
                      <Row depth={2} k={su.code} hasKids meta={<span className="muted mono" style={{ fontSize:10.5 }}>{su.completion}%</span>}>
                        <Icon n="cornerR" size={12} cls="muted"/>
                        <A href={'/projects/' + p.code + '/asm/' + su.code} className="code lnk" onClick={e => e.stopPropagation()}>{su.code}</A>
                        <span className="muted">{su.name}</span>
                      </Row>
                      {open[su.code] && assemblyParts(su.code).map(pt => (
                        <Row key={pt.id} depth={3} meta={
                          <span className="row" style={{ gap:10, alignItems:'center' }}>
                            <span className="mono muted" style={{ fontSize:10.5 }}>{pt.qty}× · {pt.grade} · {pt.thk}mm · R{pt.rev}</span>
                            <MfgStatus s={pt.status}/>
                          </span>}>
                          <A href={'/parts/' + pt.id} className="code lnk" onClick={e => e.stopPropagation()}>{pt.id}</A>
                          <span>{pt.desc}</span>
                        </Row>
                      ))}
                    </React.Fragment>
                  ))}
                  {open[a.code] && assemblyParts(a.code).map(pt => (
                    <Row key={pt.id} depth={2} meta={
                      <span className="row" style={{ gap:10, alignItems:'center' }}>
                        <span className="mono muted" style={{ fontSize:10.5 }}>{pt.qty}× · {pt.grade} · {pt.thk}mm · R{pt.rev}</span>
                        <MfgStatus s={pt.status}/>
                      </span>}>
                      <A href={'/parts/' + pt.id} className="code lnk" onClick={e => e.stopPropagation()}>{pt.id}</A>
                      <span>{pt.desc}</span>
                    </Row>
                  ))}
                </React.Fragment>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </Panel>
  );
}
function Bom(){
  return (
    <div className="page">
      <PageHead title="BOM" sub="Project → Assembly → Sub-assembly → Part · manufacturing status rolls up the tree">

      </PageHead>

                  <div style={{ fontSize:12.5, fontWeight:500 }}>{t}</div>
                  <div className="muted" style={{ fontSize:11 }}>{d}</div>
                </div>
                <Pill tone="ok">Enforced</Pill>
              </div>
            ))}
          </div>
        </Panel>
      </div>
    </div>
  );
}

/* ============================== app shell + router ============================== */
function App(){
  const { path, segs } = useRoute();
  const [cmd, setCmd] = useState(false);
  const [nav, setNav] = useState(false);
  useEffect(() => {
    const on = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); setCmd(c => !c); }
    };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, []);
  useEffect(() => { setNav(false); }, [path]);

  let page;
  const [a, b, c, d] = segs;
  if (segs.length === 0) page = <Dashboard/>;
  else if (a === 'projects' && !b) page = <Projects/>;
  else if (a === 'projects' && b && c === 'asm' && d) page = <AssemblyView project={b} code={d}/>;
  else if (a === 'projects' && b) page = <ProjectDetail code={b} tab={c}/>;
  else if (a === 'production') page = <Production/>;
  else if (a === 'outsourcing' && b) page = <OutsourcingDetail id={b}/>;
  else if (a === 'outsourcing') page = <Outsourcing/>;
  else if (a === 'bom') page = <Bom/>;
  else if (a === 'parts' && b) page = <PartDetail id={b}/>;
  else if (a === 'parts') page = <Parts/>;
  else if (a === 'cadcam') page = <CadCam/>;
  else if (a === 'nesting' && b) page = <NestingDetail id={b}/>;
  else if (a === 'nesting') page = <Nesting/>;
  else if (a === 'materials') page = <Materials/>;
  else if (a === 'inventory') page = <Inventory/>;
  else if (a === 'suppliers') page = <Suppliers/>;
  else if (a === 'qc') page = <QcPage/>;
  else if (a === 'issues') page = <Issues/>;
  else if (a === 'analytics') page = <Analytics/>;
  else if (a === 'settings') page = <Settings/>;
  else page = <div className="page"><Empty icon="search" title="Page not found" hint={'Nothing at /' + segs.join('/')} action={<A href="/" className="btn">Command Center</A>}/></div>;

  return (
    <ToastHost>
      <div className={cx('app', nav && 'nav-open')}>
        <Sidebar path={path} onNavigate={() => setNav(false)}/>
        <div className="main">
          <Topbar crumbs={resolveCrumbs(segs)} onSearch={() => setCmd(true)} onMenu={() => setNav(v => !v)}/>
          {page}
        </div>
      </div>
      <CommandPalette open={cmd} onClose={() => setCmd(false)}/>
    </ToastHost>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App/>);
</script>
